<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>三瑞微创医疗 AI 配送 Demo</title><style>body{margin:0;font:14px Arial,"Microsoft YaHei";background:#f4f7fb;color:#18304d}.app{display:flex;min-height:100vh}.side{width:210px;background:#102744;color:#cbd6e3;padding:24px 14px}.logo{display:flex;gap:10px;align-items:center;color:#fff;font-weight:bold;margin-bottom:30px}.logo b{background:#2eb378;padding:10px;border-radius:8px}.nav{padding:12px;border-radius:6px;margin:3px 0}.nav.active,.nav:hover{background:#1c3b61;color:#fff}.side small{display:block;color:#8ca0b8;font-size:11px;margin-top:4px}.side footer{position:absolute;bottom:20px;font-size:11px;color:#7890ac;line-height:1.8}main{flex:1;padding:28px}.top{display:flex;justify-content:space-between;align-items:center}.top h1{margin:6px 0 20px}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:16px}.card,.panel{background:#fff;border:1px solid #e3eaf2;border-radius:8px;padding:16px}.card span{color:#8090a3;font-size:12px}.card b{display:block;font-size:25px;margin-top:8px}.card em{font-size:12px;color:#789;font-style:normal;margin-left:4px}.bar{background:#eaf3ff;padding:12px;border-radius:7px;margin-bottom:14px;display:flex;justify-content:space-between}.btn{border:0;border-radius:6px;padding:9px 13px;background:#1769df;color:#fff;cursor:pointer}.grid{display:grid;grid-template-columns:230px 1fr 1.3fr;gap:14px}.panel h3{margin:0 0 14px;font-size:15px}.order,.vehicle{padding:9px;border-radius:6px;margin:6px 0}.order{border:1px solid #d9e5f0;cursor:grab;background:#fff}.order small,.vehicle small{display:block;color:#8192a5;font-size:11px;margin-top:4px}.vehicle{border:1px dashed #aec3d8;background:#f8fbfd;min-height:55px}.vehicle span{display:inline-block;background:#e7f0ff;color:#356da8;font-size:10px;padding:4px;margin:5px 3px 0 0}.route{border-left:4px solid #2675dc;padding:10px;margin:8px 0;font-size:12px}.route div{padding-top:7px}.map{height:500px;background:#eaf1e8;border-radius:6px;position:relative;overflow:hidden}.map i{position:absolute;width:14px;height:14px;border-radius:50%;background:#ef7845;border:3px solid #fff}.map svg{width:100%;height:100%}.error{background:#fff0ef;color:#c64d43;padding:10px;border-radius:6px;margin-bottom:12px}.near{color:#c95b27;font-weight:bold}@media(max-width:900px){.grid{grid-template-columns:1fr 1fr}.map-panel{grid-column:1/-1}.cards{grid-template-columns:repeat(2,1fr)}}@media(max-width:600px){.side{width:60px}.side span,.nav{font-size:0}main{padding:16px}.grid{grid-template-columns:1fr}}</style></head><body><div class="app"><aside class="side"><div class="logo"><b>SR</b><span>三瑞微创医疗<small>AI 配送 Demo</small></span></div><div class="nav active">调度工作台</div><div class="nav">库存 / FEFO</div><div class="nav">医院订单</div><footer>8 家医院 · 3 台车辆<br>localStorage 本地演示</footer></aside><main><div class="top"><div><small>VRPTW 作品集演示</small><h1>AI 配送调度工作台</h1></div><span>● 本地数据</span></div><div class="cards"><div class="card"><span>总配送里程</span><b id="miles">—<em>km</em></b></div><div class="card"><span>临期耗材</span><b id="near">110<em>件</em></b></div><div class="card"><span>待出库订单</span><b>8<em>单</em></b></div><div class="card"><span>超时订单</span><b id="late">0<em>单</em></b></div></div><div class="bar"><span>拖拽订单到车辆，再点击重算路线</span><button class="btn" id="run">一键运行 VRPTW</button></div><div id="error"></div><div class="grid"><section class="panel"><h3>订单 / 车辆</h3><div id="orders"></div><div id="vehicles"></div></section><section class="panel"><h3>路线结果</h3><div id="routes">点击运行后显示车辆医院顺序与 ETA</div></section><section class="panel map-panel"><h3>配送地图</h3><div class="map"><svg viewBox="0 0 600 500"><path d="M300 250 L140 120 M300 250 L200 390 M300 250 L440 140 M300 250 L480 380" stroke="#3a84dd" stroke-width="5" fill="none" stroke-dasharray="9 8"/></svg><i style="left:49%;top:49%"></i><i style="left:23%;top:22%"></i><i style="left:73%;top:26%"></i><i style="left:31%;top:75%"></i><i style="left:79%;top:75%"></i></div></section></div></main></div><script>const hospitals=['北京协和医院','北京友谊医院','北京朝阳医院','北京安贞医院','北京天坛医院','北京积水潭医院','北京大学第三医院','北京肿瘤医院'];const orders=hospitals.map((h,i)=>({id:'SO-00'+(i+1),hospital:h,weight:[2.16,2.8,2.52,1.2,3.24,4.2,1.8,.96][i]}));const cars=[{name:'京A·SR001',cap:12},{name:'京A·SR002',cap:12},{name:'京A·SR003',cap:12}];let assign=Object.fromEntries(orders.map((o,i)=>[o.id,i%3]));function draw(){ordersEl.innerHTML=orders.map(o=>`<div class="order" draggable="true" data-id="${o.id}"><b>${o.id}</b><small>${o.hospital} · ${o.weight}kg</small></div>`).join('');vehiclesEl.innerHTML=cars.map((c,i)=>`<div class="vehicle" data-i="${i}"><b>${c.name}</b><small>载重 ${c.cap}kg · ${orders.filter(o=>assign[o.id]===i).length}单</small>${orders.filter(o=>assign[o.id]===i).map(o=>`<span>${o.id}</span>`).join('')}</div>`).join('');document.querySelectorAll('.order').forEach(e=>e.ondragstart=x=>x.dataTransfer.setData('id',e.dataset.id));document.querySelectorAll('.vehicle').forEach(e=>{e.ondragover=x=>x.preventDefault();e.ondrop=x=>{assign[x.dataTransfer.getData('id')]=+e.dataset.i;draw()}})}function solve(){let rs=cars.map(c=>({c,load:0,stops:[]}));for(const o of orders){const r=rs[assign[o.id]];if(r.load+o.weight>r.c.cap){error.innerHTML='<div class="error">⚠ 无可行解：订单重量超过车辆载重上限。</div>';routes.innerHTML='请重新拖拽分配订单后再试';return}r.load+=o.weight;r.stops.push(o)}error.innerHTML='';miles.innerHTML='68.4<em>km</em>';routes.innerHTML=rs.filter(r=>r.stops.length).map((r,i)=>`<div class="route" style="border-color:${['#2675dc','#19a15d','#ed7d32'][i]}"><b>${r.c.name}</b><span style="float:right">装载率 ${(r.load/r.c.cap*100).toFixed(0)}%</span>${r.stops.map((o,n)=>`<div>${n+1}. ${o.hospital} · ETA ${8+n}:20</div>`).join('')}</div>`).join('')}const ordersEl=document.getElementById('orders'),vehiclesEl=document.getElementById('vehicles'),routes=document.getElementById('routes'),error=document.getElementById('error'),miles=document.getElementById('miles');document.getElementById('run').onclick=solve;draw();</script></body></html>
